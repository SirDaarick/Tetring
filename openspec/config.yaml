schema: spec-driven

context: |
  Tech stack: FastAPI (Python 3.14), Node.js/Express, React (TS/Vite/Tailwind v4), Streamlit
  Architecture: Monorepo with front-end (React), back-end (FastAPI), scraper API (saes-api), and root Streamlit dashboard.
  Testing: Backend Pytest suite. Frontend/saes-api have no test runners (lint/type-check only).
  Style: Spanish (Mexico) for Streamlit UI and frontend spec. English for codebase.

testing:
  strict_tdd: true
  detected: "2026-07-17"
  test_runner:
    command: "backend/.venv/bin/pytest"
    framework: "pytest"
  test_layers:
    unit:
      available: true
      tool: "pytest"
    integration:
      available: true
      tool: "pytest + pytest-asyncio"
    e2e:
      available: false
      tool: "—"
  coverage:
    available: false
    command: "—"
  quality_tools:
    linter:
      available: true
      command: "oxlint"
    type_checker:
      available: true
      command: "tsc"
    formatter:
      available: false
      command: "—"

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "cd backend && .venv/bin/pytest"
  verify:
    test_command: "cd backend && .venv/bin/pytest"
    build_command: "cd frontend && npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
